# Configuración de Base de Datos - Sistema Universitario
# =======================================================

# H2 Database Configuration (In-Memory)
h2.url=jdbc:h2:mem:universidad;DB_CLOSE_DELAY=-1
h2.user=sa
h2.password=

# MySQL Database Configuration (Docker)
mysql.url=jdbc:mysql://localhost:3306/sistema_universitario?useSSL=false&allowPublicKeyRetrieval=true
mysql.user=universidad_user
mysql.password=universidad_pass

# Oracle Database Configuration (Docker)
oracle.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
oracle.user=universidad_user
oracle.password=universidad_pass

# Driver Class Names
h2.driver=org.h2.Driver
mysql.driver=com.mysql.cj.jdbc.Driver
oracle.driver=oracle.jdbc.OracleDriver

# Connection Pool Settings (opcional para el futuro)
connection.timeout=30000
connection.max.pool.size=10
connection.min.pool.size=2