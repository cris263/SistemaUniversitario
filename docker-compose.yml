version: "3.8"

services:
  mysql-db:
    image: mysql:8.0
    container_name: sistema-universitario-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: sistema_universitario
      MYSQL_USER: universidad_user
      MYSQL_PASSWORD: universidad_pass
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - universidad-network
      
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: sistema-universitario-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: admin123
      APP_USER: universidad_user
      APP_USER_PASSWORD: universidad_pass
    networks:
      - universidad-network

volumes:
  mysql-data:
    driver: local

networks:
  universidad-network:
    driver: bridge
